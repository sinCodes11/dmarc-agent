<!doctype html>
<html lang="en">
  <head>
    <script src="https://t.contentsquare.net/uxa/d8252efa57e16.js"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-K03JBNND58"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-K03JBNND58');
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SentryDMARC | Forgot Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>

    <nav class="s-nav">
      <div class="s-nav__inner">
        <a href="/" class="s-logo">SentryDMARC</a>
      </div>
    </nav>

    <main class="nav-offset flex items-center justify-center px-6 py-12" style="min-height:calc(100vh - 72px)">
      <div class="w-full max-w-sm">
        <div class="panel rounded-lg p-8">
          <p class="s-tag">Account Recovery</p>
          <h1 class="text-2xl font-semibold mt-1" style="font-family:var(--font-mono)">Reset password</h1>
          <p class="mt-1 text-sm" style="font-family:var(--font-sans);color:var(--text-secondary)">
            Enter your email and we'll send a reset link.
          </p>

          <form id="forgot-form" class="mt-7 space-y-5">
            <div>
              <label class="s-label">Email</label>
              <input id="email" type="email" required class="s-input" placeholder="you@company.com" />
            </div>
            <button id="forgot-btn" type="submit" class="s-btn w-full" style="justify-content:center">
              Send reset link
            </button>
          </form>

          <p id="forgot-success" class="hidden mt-3 text-xs" style="color:#bbf7d0;font-family:var(--font-mono)">
            Check your email for a reset link.
          </p>
          <p id="forgot-error" class="hidden mt-3 text-xs" style="color:#fca5a5;font-family:var(--font-mono)"></p>

          <p class="mt-6 text-xs" style="font-family:var(--font-mono)">
            <a href="/login" class="s-nav__link" style="display:inline;font-size:12px">Back to login</a>
          </p>
        </div>
      </div>
    </main>

    <script src="/assets/app.js"></script>
    <script>
      byId('forgot-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        clearError('forgot-error');
        byId('forgot-success').classList.add('hidden');

        const email = byId('email').value.trim().toLowerCase();
        const btn = byId('forgot-btn');
        const original = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Sending...';

        try {
          await requestJSON('/auth/forgot-password', {
            method: 'POST',
            body: JSON.stringify({ email }),
          });
          byId('forgot-success').classList.remove('hidden');
        } catch (err) {
          showError('forgot-error', err.message || 'Request failed');
        } finally {
          btn.disabled = false;
          btn.textContent = original;
        }
      });
    </script>
  </body>
</html>
