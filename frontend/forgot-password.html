<!doctype html>
<html lang="en">
  <head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-K03JBNND58"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);} 
      gtag('js', new Date());
      gtag('config', 'G-K03JBNND58');
    </script>
    <script src="https://t.contentsquare.net/uxa/7b991b222f744.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SentryDMARC | Forgot Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body class="text-slate-100">
    <main class="max-w-md mx-auto px-6 py-20">
      <section class="panel rounded-2xl p-8">
        <h1 class="text-3xl font-semibold">Reset password</h1>
        <p class="text-slate-300 mt-2 text-sm">Enter your email and we will send a reset link.</p>

        <form id="forgot-form" class="mt-6 space-y-4">
          <label class="block">
            <span class="text-xs uppercase tracking-wider text-slate-300">Email</span>
            <input id="email" type="email" required class="mt-1 w-full rounded-xl px-4 py-3 bg-slate-900 border border-slate-700 focus:border-blue-500 outline-none" />
          </label>
          <button id="forgot-btn" type="submit" class="w-full glow-btn rounded-xl bg-blue-500 hover:bg-blue-400 text-white font-semibold px-6 py-3">Send reset link</button>
        </form>

        <p id="forgot-success" class="hidden mt-3 text-green-400 text-sm">Check your email for a reset link.</p>
        <p id="forgot-error" class="hidden mt-3 text-red-400 text-sm"></p>
        <p class="mt-5 text-sm text-slate-300"><a href="/login" class="text-blue-300 hover:text-blue-200">Back to login</a></p>
      </section>
    </main>

    <script src="/assets/app.js"></script>
    <script>
      byId('forgot-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        clearError('forgot-error');
        byId('forgot-success').classList.add('hidden');

        const email = byId('email').value.trim().toLowerCase();
        const btn = byId('forgot-btn');
        const original = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Sending...';

        try {
          await requestJSON('/auth/forgot-password', {
            method: 'POST',
            body: JSON.stringify({ email }),
          });
          byId('forgot-success').classList.remove('hidden');
        } catch (err) {
          showError('forgot-error', err.message || 'Request failed');
        } finally {
          btn.disabled = false;
          btn.textContent = original;
        }
      });
    </script>
  </body>
</html>
