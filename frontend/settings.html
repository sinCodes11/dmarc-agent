<!doctype html>
<html lang="en">
  <head>
    <script src="https://t.contentsquare.net/uxa/d8252efa57e16.js"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-K03JBNND58"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-K03JBNND58');
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SentryDMARC | Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>

    <nav class="s-nav">
      <div class="s-nav__inner">
        <a href="/dashboard" class="s-logo">SentryDMARC</a>
        <div class="flex items-center gap-4">
          <a href="/dashboard" class="s-nav__link hide-mobile">Dashboard</a>
          <button id="logout-btn" class="s-nav__link">Logout</button>
        </div>
      </div>
    </nav>

    <main class="nav-offset max-w-3xl mx-auto px-6 py-10 md:py-14 space-y-6">

      <header>
        <p class="s-tag">Account</p>
        <h1 class="text-3xl font-semibold mt-1" style="font-family:var(--font-mono)">Settings</h1>
        <p class="mt-1 text-sm" style="font-family:var(--font-sans);color:var(--text-secondary)">
          Manage account security and billing.
        </p>
      </header>

      <p id="settings-error" class="hidden text-xs" style="color:#fca5a5;font-family:var(--font-mono)"></p>

      <!-- Account Info -->
      <section class="panel rounded-lg p-6">
        <p class="s-tag">Account Info</p>
        <p class="text-sm mt-2" style="font-family:var(--font-mono);color:var(--text-secondary)">
          Email: <span id="user-email" style="color:var(--text-primary)">—</span>
        </p>
      </section>

      <!-- Change Password -->
      <section class="panel rounded-lg p-6">
        <p class="s-tag">Security</p>
        <h2 class="text-lg font-semibold mt-1" style="font-family:var(--font-mono)">Change Password</h2>
        <form id="password-form" class="mt-5 space-y-5">
          <div>
            <label class="s-label">Current Password</label>
            <input id="current-password" type="password" required class="s-input" placeholder="••••••••" />
          </div>
          <div>
            <label class="s-label">New Password</label>
            <input id="new-password" type="password" minlength="8" required class="s-input" placeholder="••••••••" />
          </div>
          <div>
            <label class="s-label">Confirm New Password</label>
            <input id="confirm-password" type="password" minlength="8" required class="s-input" placeholder="••••••••" />
          </div>
          <button id="password-btn" type="submit" class="s-btn">Update Password</button>
        </form>
        <p id="password-success" class="hidden mt-3 text-xs" style="color:#bbf7d0;font-family:var(--font-mono)">
          Password updated.
        </p>
        <p id="password-error" class="hidden mt-3 text-xs" style="color:#fca5a5;font-family:var(--font-mono)"></p>
      </section>

      <!-- Billing -->
      <section class="panel rounded-lg p-6">
        <p class="s-tag">Billing</p>
        <h2 class="text-lg font-semibold mt-1" style="font-family:var(--font-mono)">Plan &amp; Billing</h2>
        <p class="text-sm mt-2" style="font-family:var(--font-mono);color:var(--text-secondary)">
          Current plan: <span id="plan-name" style="color:var(--accent)">Starter</span>
        </p>
        <button id="billing-btn" class="s-btn s-btn--outline mt-5">Manage Billing</button>
      </section>

    </main>

    <script src="/assets/app.js"></script>
    <script src="/assets/auth.js"></script>
    <script>
      function planLabel(plan) {
        const p = String(plan || 'starter').toLowerCase();
        return p.charAt(0).toUpperCase() + p.slice(1);
      }

      async function loadSettings() {
        if (!requireAuth()) return;
        try {
          const user = await requestJSON('/api/user', { headers: authHeaders() });
          byId('user-email').textContent = user.email;
          byId('plan-name').textContent = planLabel(user.plan);
        } catch (err) {
          showError('settings-error', err.message || 'Failed to load settings');
        }
      }

      byId('password-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        clearError('password-error');
        byId('password-success').classList.add('hidden');

        const currentPassword = byId('current-password').value;
        const newPassword = byId('new-password').value;
        const confirm = byId('confirm-password').value;

        if (newPassword !== confirm) {
          showError('password-error', 'New passwords do not match');
          return;
        }

        const btn = byId('password-btn');
        const original = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Updating...';

        try {
          await requestJSON('/api/user/password', {
            method: 'POST',
            headers: authHeaders(),
            body: JSON.stringify({ current_password: currentPassword, new_password: newPassword }),
          });
          byId('password-success').classList.remove('hidden');
          byId('password-form').reset();
        } catch (err) {
          showError('password-error', err.message || 'Password update failed');
        } finally {
          btn.disabled = false;
          btn.textContent = original;
        }
      });

      byId('billing-btn').addEventListener('click', async () => {
        try {
          const data = await requestJSON('/api/billing/portal', {
            method: 'POST',
            headers: authHeaders(),
          });
          window.location.href = data.portal_url;
        } catch (err) {
          showError('settings-error', err.message || 'Unable to open billing portal');
        }
      });

      byId('logout-btn').addEventListener('click', logout);
      loadSettings();
    </script>
  </body>
</html>
