<!doctype html>
<html lang="en">
  <head>
    <script src="https://t.contentsquare.net/uxa/d8252efa57e16.js"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-K03JBNND58"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-K03JBNND58');
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SentryDMARC | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>

    <nav class="s-nav">
      <div class="s-nav__inner">
        <a href="/" class="s-logo">SentryDMARC</a>
      </div>
    </nav>

    <main class="nav-offset flex items-center justify-center min-h-screen px-6 py-12" style="min-height:calc(100vh - 72px)">
      <div class="w-full max-w-sm">
        <div class="panel rounded-lg p-8">
          <p class="s-tag">Authentication</p>
          <h1 class="text-2xl font-semibold mt-1" style="font-family:var(--font-mono)">Log in</h1>
          <p class="mt-1 text-sm" style="font-family:var(--font-sans);color:var(--text-secondary)">
            Access your monitoring dashboard.
          </p>

          <form id="login-form" class="mt-7 space-y-5">
            <div>
              <label class="s-label">Email</label>
              <input id="email" type="email" required class="s-input" placeholder="you@company.com" />
            </div>
            <div>
              <label class="s-label">Password</label>
              <input id="password" type="password" required class="s-input" placeholder="••••••••" />
            </div>
            <button id="login-btn" type="submit" class="s-btn w-full" style="justify-content:center">
              Log in
            </button>
          </form>

          <p id="login-error" class="hidden mt-3 text-xs" style="color:#fca5a5;font-family:var(--font-mono)"></p>

          <div class="mt-6 flex items-center justify-between text-xs" style="font-family:var(--font-mono)">
            <a href="/forgot-password" class="s-nav__link" style="font-size:12px">Forgot password?</a>
            <a href="/signup" class="s-nav__link" style="font-size:12px">Create account</a>
          </div>
        </div>
      </div>
    </main>

    <script src="/assets/app.js"></script>
    <script src="/assets/auth.js"></script>
    <script>
      if (getToken()) window.location.href = '/dashboard';

      byId('login-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        clearError('login-error');

        const email = byId('email').value.trim().toLowerCase();
        const password = byId('password').value;
        const btn = byId('login-btn');
        const original = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Logging in...';

        try {
          const data = await requestJSON('/auth/login', {
            method: 'POST',
            body: JSON.stringify({ email, password }),
          });
          localStorage.setItem('sentrydmarc_email', email);
          setToken(data.token);
          window.location.href = '/dashboard';
        } catch (err) {
          showError('login-error', err.message || 'Login failed');
          btn.disabled = false;
          btn.textContent = original;
        }
      });
    </script>
  </body>
</html>
