<!doctype html>
<html lang="en">
  <head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-K03JBNND58"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-K03JBNND58');
    </script>
    <script src="https://t.contentsquare.net/uxa/7b991b222f744.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SentryDMARC | Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>

    <nav class="s-nav">
      <div class="s-nav__inner">
        <a href="/" class="s-logo">SentryDMARC</a>
      </div>
    </nav>

    <main class="nav-offset flex items-center justify-center px-6 py-12" style="min-height:calc(100vh - 72px)">
      <div class="w-full max-w-sm">
        <div class="panel rounded-lg p-8">
          <p class="s-tag">New Account</p>
          <h1 class="text-2xl font-semibold mt-1" style="font-family:var(--font-mono)">Create account</h1>
          <p class="mt-1 text-sm" style="font-family:var(--font-sans);color:var(--text-secondary)">
            Set up your SentryDMARC dashboard access.
          </p>

          <form id="signup-form" class="mt-7 space-y-5">
            <div>
              <label class="s-label">Email</label>
              <input id="email" type="email" required class="s-input" placeholder="you@company.com" />
            </div>
            <div>
              <label class="s-label">Password</label>
              <input id="password" type="password" minlength="8" required class="s-input" placeholder="••••••••" />
            </div>
            <div>
              <label class="s-label">Confirm Password</label>
              <input id="confirm-password" type="password" minlength="8" required class="s-input" placeholder="••••••••" />
            </div>
            <button id="signup-btn" type="submit" class="s-btn w-full" style="justify-content:center">
              Create account
            </button>
          </form>

          <p id="signup-error" class="hidden mt-3 text-xs" style="color:#fca5a5;font-family:var(--font-mono)"></p>

          <p class="mt-6 text-xs" style="font-family:var(--font-mono);color:var(--text-secondary)">
            Already have an account?
            <a href="/login" class="s-nav__link" style="display:inline;font-size:12px">Log in</a>
          </p>
        </div>
      </div>
    </main>

    <script src="/assets/app.js"></script>
    <script src="/assets/auth.js"></script>
    <script>
      if (getToken()) window.location.href = '/dashboard';

      byId('signup-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        clearError('signup-error');

        const email = byId('email').value.trim().toLowerCase();
        const password = byId('password').value;
        const confirm = byId('confirm-password').value;

        if (password !== confirm) {
          showError('signup-error', 'Passwords do not match');
          return;
        }

        const btn = byId('signup-btn');
        const original = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Creating...';

        try {
          const data = await requestJSON('/auth/signup', {
            method: 'POST',
            body: JSON.stringify({ email, password }),
          });
          localStorage.setItem('sentrydmarc_email', email);
          setToken(data.token);
          window.location.href = '/dashboard';
        } catch (err) {
          showError('signup-error', err.message || 'Signup failed');
          btn.disabled = false;
          btn.textContent = original;
        }
      });
    </script>
  </body>
</html>
