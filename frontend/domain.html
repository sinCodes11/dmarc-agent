<!doctype html>
<html lang="en">
  <head>
    <script src="https://t.contentsquare.net/uxa/d8252efa57e16.js"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-K03JBNND58"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-K03JBNND58');
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SentryDMARC | Domain</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>

    <nav class="s-nav">
      <div class="s-nav__inner">
        <a href="/dashboard" class="s-logo">SentryDMARC</a>
        <div class="flex items-center gap-4">
          <a href="/dashboard" class="s-nav__link hide-mobile">Dashboard</a>
          <a href="/settings" class="s-nav__link hide-mobile">Settings</a>
          <button id="logout-btn" class="s-nav__link">Logout</button>
        </div>
      </div>
    </nav>

    <main class="nav-offset max-w-5xl mx-auto px-6 py-10 md:py-14 space-y-6">

      <header class="panel rounded-lg p-6 md:p-8">
        <div class="flex flex-wrap items-start justify-between gap-4">
          <div>
            <p class="s-tag">Domain Security</p>
            <h1 id="domain-name" class="text-3xl md:text-4xl font-semibold mt-1"
                style="font-family:var(--font-mono)">Domain</h1>
            <p class="mt-2 text-xs" style="color:var(--text-muted);font-family:var(--font-mono)">
              Last scanned: <span id="last-scanned">Never</span>
            </p>
          </div>
          <span id="risk-badge" class="px-4 py-2 rounded text-xs font-semibold risk-UNKNOWN"
                style="font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.08em">
            UNKNOWN
          </span>
        </div>
      </header>

      <p id="domain-error" class="hidden text-xs" style="color:#fca5a5;font-family:var(--font-mono)"></p>

      <!-- Auth Status -->
      <section>
        <p class="s-tag">Authentication Status</p>
        <div id="status-grid" class="mt-2 grid md:grid-cols-3 gap-4"></div>
      </section>

      <!-- Issues -->
      <section>
        <p class="s-tag">Detected Issues</p>
        <ol id="issues-list" class="mt-2 space-y-3"></ol>
      </section>

      <!-- Records -->
      <section>
        <p class="s-tag">Recommended DNS Records</p>
        <div id="records-wrap" class="mt-2 space-y-3"></div>
      </section>

      <!-- Actions -->
      <section class="panel rounded-lg p-6">
        <p class="s-tag">Actions</p>
        <div class="flex flex-wrap gap-3 mt-2">
          <button id="rescan-btn" class="s-btn">Re-scan Now</button>
          <button id="delete-btn" class="s-btn s-btn--danger">Remove Domain</button>
        </div>
      </section>

      <!-- Scan History -->
      <section class="panel rounded-lg p-6">
        <p class="s-tag">Scan History</p>
        <div class="overflow-x-auto mt-2">
          <table class="min-w-full text-xs" style="font-family:var(--font-mono)">
            <thead>
              <tr style="border-bottom:1px solid var(--border)">
                <th class="text-left py-2 pr-6" style="color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em">Date</th>
                <th class="text-left py-2" style="color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em">Risk</th>
              </tr>
            </thead>
            <tbody id="history-body"></tbody>
          </table>
        </div>
      </section>

    </main>

    <script src="/assets/app.js"></script>
    <script src="/assets/auth.js"></script>
    <script>
      const domainId = qs('id');

      function severityClasses(sev) {
        const s = String(sev || 'INFO').toUpperCase();
        if (s === 'CRITICAL' || s === 'HIGH') return 'text-red-300 border-red-500/40 bg-red-900/40';
        if (s === 'MEDIUM') return 'text-amber-300 border-amber-500/40 bg-amber-900/30';
        if (s === 'LOW') return 'text-green-300 border-green-500/40 bg-green-900/30';
        return 'text-slate-300 border-slate-500/40 bg-slate-800/40';
      }

      function bindCopyButtons() {
        document.querySelectorAll('.copy-btn').forEach((btn) => {
          btn.addEventListener('click', async () => {
            const target = byId(btn.getAttribute('data-copy'));
            if (!target) return;
            await navigator.clipboard.writeText(target.innerText);
            btn.textContent = 'Copied';
            setTimeout(() => { btn.textContent = 'Copy'; }, 1200);
          });
        });
      }

      async function loadDomain() {
        if (!requireAuth()) return;
        if (!domainId) { showError('domain-error', 'Missing domain id'); return; }

        try {
          const [domainData, scans] = await Promise.all([
            requestJSON(`/api/user/domains/${encodeURIComponent(domainId)}`, { headers: authHeaders() }),
            requestJSON(`/api/user/domains/${encodeURIComponent(domainId)}/scans`, { headers: authHeaders() }),
          ]);

          byId('domain-name').textContent = domainData.domain;
          byId('last-scanned').textContent = fmtDate(domainData.last_scanned_at);

          const risk = String(domainData.current_risk_level || 'UNKNOWN').toUpperCase();
          const badge = byId('risk-badge');
          badge.className = `px-4 py-2 rounded text-xs font-semibold risk-${risk}`;
          badge.style.cssText = 'font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.08em';
          badge.textContent = `${risk} RISK`;

          const result = domainData.latest_scan_result || {};

          const statusWrap = byId('status-grid');
          statusWrap.innerHTML = '';
          const securityStatus = result.security_status || {};
          ['spf', 'dkim', 'dmarc'].forEach((key) => {
            if (securityStatus[key] !== undefined) renderStatusCard(statusWrap, key, securityStatus[key]);
          });

          const issues = asIssues(result);
          byId('issues-list').innerHTML = issues.length
            ? issues.map((issue, idx) => `<li class="panel rounded-lg p-4 border ${severityClasses(issue.severity)}">
                <p class="text-xs uppercase tracking-wider mb-1" style="font-family:var(--font-mono)">${idx + 1}. ${issue.severity}</p>
                <p class="font-semibold" style="font-family:var(--font-mono)">${issue.title}</p>
                <p class="text-sm mt-1" style="font-family:var(--font-sans)">${issue.description}</p>
                ${issue.remediation ? `<p class="text-xs mt-2 italic" style="color:var(--text-secondary);font-family:var(--font-sans)">${issue.remediation}</p>` : ''}
              </li>`).join('')
            : '<li class="text-sm" style="color:var(--text-secondary)">No issues detected.</li>';

          const records = asRecords(result);
          byId('records-wrap').innerHTML = records.length
            ? records.map((rec, idx) => `<div class="panel rounded-lg p-4">
                <div class="flex items-center justify-between gap-3 mb-3">
                  <p class="text-xs uppercase tracking-wider" style="color:var(--text-muted);font-family:var(--font-mono)">${rec.label} &mdash; Type: ${rec.type} &mdash; Name: <code style="color:var(--accent)">${rec.name}</code></p>
                  <button class="copy-btn" data-copy="record-${idx}">Copy</button>
                </div>
                <code id="record-${idx}" class="block whitespace-pre-wrap break-all text-sm" style="color:var(--text-secondary);font-family:var(--font-mono)">${rec.value}</code>
              </div>`).join('')
            : '<p class="text-sm" style="color:var(--text-secondary)">No record changes needed.</p>';

          bindCopyButtons();

          byId('history-body').innerHTML = scans.length
            ? scans.map((scan) => `<tr class="table-row">
                <td class="py-2 pr-6" style="color:var(--text-secondary)">${fmtDate(scan.created_at)}</td>
                <td class="py-2"><span class="px-2 py-1 rounded text-xs font-semibold ${riskBadgeClass(scan.risk_level)}">${scan.risk_level}</span></td>
              </tr>`).join('')
            : '<tr><td colspan="2" class="py-3" style="color:var(--text-muted)">No scans yet.</td></tr>';
        } catch (err) {
          showError('domain-error', err.message || 'Failed to load domain');
        }
      }

      byId('rescan-btn').addEventListener('click', async () => {
        if (!domainId) return;
        const btn = byId('rescan-btn');
        const original = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Scanning...';
        try {
          await requestJSON(`/api/user/domains/${encodeURIComponent(domainId)}/scan`, {
            method: 'POST',
            headers: authHeaders(),
          });
          await loadDomain();
        } catch (err) {
          showError('domain-error', err.message || 'Scan failed');
        } finally {
          btn.disabled = false;
          btn.textContent = original;
        }
      });

      byId('delete-btn').addEventListener('click', async () => {
        if (!domainId) return;
        if (!window.confirm('Remove this domain and all scan history?')) return;
        try {
          await requestJSON(`/api/user/domains/${encodeURIComponent(domainId)}`, {
            method: 'DELETE',
            headers: authHeaders(),
          });
          window.location.href = '/dashboard';
        } catch (err) {
          showError('domain-error', err.message || 'Could not remove domain');
        }
      });

      byId('logout-btn').addEventListener('click', logout);
      loadDomain();
    </script>
  </body>
</html>
