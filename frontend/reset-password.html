<!doctype html>
<html lang="en">
  <head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GDW51NR1KQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);} 
      gtag('js', new Date());
      gtag('config', 'G-GDW51NR1KQ');
    </script>
    <script src="https://t.contentsquare.net/uxa/7b991b222f744.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SentryDMARC | Set New Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body class="text-slate-100">
    <main class="max-w-md mx-auto px-6 py-20">
      <section class="panel rounded-2xl p-8">
        <h1 class="text-3xl font-semibold">Set a new password</h1>
        <p class="text-slate-300 mt-2 text-sm">Choose a secure password with at least 8 characters.</p>

        <form id="reset-form" class="mt-6 space-y-4">
          <label class="block">
            <span class="text-xs uppercase tracking-wider text-slate-300">New Password</span>
            <input id="new-password" type="password" minlength="8" required class="mt-1 w-full rounded-xl px-4 py-3 bg-slate-900 border border-slate-700 focus:border-blue-500 outline-none" />
          </label>
          <label class="block">
            <span class="text-xs uppercase tracking-wider text-slate-300">Confirm Password</span>
            <input id="confirm-password" type="password" minlength="8" required class="mt-1 w-full rounded-xl px-4 py-3 bg-slate-900 border border-slate-700 focus:border-blue-500 outline-none" />
          </label>
          <button id="reset-btn" type="submit" class="w-full glow-btn rounded-xl bg-blue-500 hover:bg-blue-400 text-white font-semibold px-6 py-3">Update password</button>
        </form>

        <p id="reset-error" class="hidden mt-3 text-red-400 text-sm"></p>
      </section>
    </main>

    <script src="/assets/app.js"></script>
    <script>
      const token = qs('token');
      if (!token) showError('reset-error', 'Missing reset token.');

      byId('reset-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        clearError('reset-error');

        const password = byId('new-password').value;
        const confirm = byId('confirm-password').value;

        if (password !== confirm) {
          showError('reset-error', 'Passwords do not match');
          return;
        }

        if (!token) {
          showError('reset-error', 'Missing reset token.');
          return;
        }

        const btn = byId('reset-btn');
        const original = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Updating...';

        try {
          await requestJSON('/auth/reset-password', {
            method: 'POST',
            body: JSON.stringify({ token, new_password: password }),
          });
          window.location.href = '/login';
        } catch (err) {
          showError('reset-error', err.message || 'Reset failed');
          btn.disabled = false;
          btn.textContent = original;
        }
      });
    </script>
  </body>
</html>
