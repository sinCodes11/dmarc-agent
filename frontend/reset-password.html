<!doctype html>
<html lang="en">
  <head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-K03JBNND58"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-K03JBNND58');
    </script>
    <script src="https://t.contentsquare.net/uxa/7b991b222f744.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SentryDMARC | Set New Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>

    <nav class="s-nav">
      <div class="s-nav__inner">
        <a href="/" class="s-logo">SentryDMARC</a>
      </div>
    </nav>

    <main class="nav-offset flex items-center justify-center px-6 py-12" style="min-height:calc(100vh - 72px)">
      <div class="w-full max-w-sm">
        <div class="panel rounded-lg p-8">
          <p class="s-tag">Account Recovery</p>
          <h1 class="text-2xl font-semibold mt-1" style="font-family:var(--font-mono)">Set a new password</h1>
          <p class="mt-1 text-sm" style="font-family:var(--font-sans);color:var(--text-secondary)">
            Choose a secure password with at least 8 characters.
          </p>

          <form id="reset-form" class="mt-7 space-y-5">
            <div>
              <label class="s-label">New Password</label>
              <input id="new-password" type="password" minlength="8" required class="s-input" placeholder="••••••••" />
            </div>
            <div>
              <label class="s-label">Confirm Password</label>
              <input id="confirm-password" type="password" minlength="8" required class="s-input" placeholder="••••••••" />
            </div>
            <button id="reset-btn" type="submit" class="s-btn w-full" style="justify-content:center">
              Update password
            </button>
          </form>

          <p id="reset-error" class="hidden mt-3 text-xs" style="color:#fca5a5;font-family:var(--font-mono)"></p>
        </div>
      </div>
    </main>

    <script src="/assets/app.js"></script>
    <script>
      const token = qs('token');
      if (!token) showError('reset-error', 'Missing reset token.');

      byId('reset-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        clearError('reset-error');

        const password = byId('new-password').value;
        const confirm = byId('confirm-password').value;

        if (password !== confirm) {
          showError('reset-error', 'Passwords do not match');
          return;
        }

        if (!token) {
          showError('reset-error', 'Missing reset token.');
          return;
        }

        const btn = byId('reset-btn');
        const original = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Updating...';

        try {
          await requestJSON('/auth/reset-password', {
            method: 'POST',
            body: JSON.stringify({ token, new_password: password }),
          });
          window.location.href = '/login';
        } catch (err) {
          showError('reset-error', err.message || 'Reset failed');
          btn.disabled = false;
          btn.textContent = original;
        }
      });
    </script>
  </body>
</html>
