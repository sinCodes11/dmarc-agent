<!doctype html>
<html lang="en">
  <head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-K03JBNND58"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-K03JBNND58');
    </script>
    <script src="https://t.contentsquare.net/uxa/7b991b222f744.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SentryDMARC | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>

    <nav class="s-nav">
      <div class="s-nav__inner">
        <a href="/dashboard" class="s-logo">SentryDMARC</a>
        <div class="flex items-center gap-4">
          <span id="plan-badge" class="plan-badge">Starter</span>
          <a href="/settings" class="s-nav__link hide-mobile">Settings</a>
          <button id="logout-btn" class="s-nav__link">Logout</button>
        </div>
      </div>
    </nav>

    <main class="nav-offset max-w-5xl mx-auto px-6 py-10 md:py-14 space-y-6">

      <header>
        <p class="s-tag">Dashboard</p>
        <h1 class="text-3xl md:text-4xl font-semibold" style="font-family:var(--font-mono)">Domain Monitor</h1>
        <p class="mt-2 text-sm" style="font-family:var(--font-sans);color:var(--text-secondary)">
          Monitor and improve email security posture across your domains.
        </p>
      </header>

      <p id="dashboard-error" class="hidden text-xs" style="color:#fca5a5;font-family:var(--font-mono)"></p>

      <!-- Domains -->
      <section class="panel rounded-lg p-6 md:p-7">
        <div class="flex items-center justify-between gap-3 flex-wrap">
          <h2 class="text-xl font-semibold" style="font-family:var(--font-mono)">Your Domains</h2>
          <span id="domain-limit" class="text-xs" style="color:var(--text-muted);font-family:var(--font-mono)">
            0 of 1 domains
          </span>
        </div>
        <p id="empty-state" class="hidden text-sm mt-3" style="color:var(--text-secondary);font-family:var(--font-sans)">
          No domains yet — add your first domain below.
        </p>
        <div id="domains-wrap" class="mt-5 grid md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      </section>

      <!-- Add Domain -->
      <section class="panel rounded-lg p-6 md:p-7">
        <p class="s-tag">Add Domain</p>
        <h2 class="text-lg font-semibold mt-1" style="font-family:var(--font-mono)">Monitor a new domain</h2>
        <form id="add-domain-form" class="mt-5 flex flex-col md:flex-row gap-3">
          <input id="domain-input" type="text" placeholder="example.com"
                 class="s-input flex-1" style="border-radius:4px" />
          <button id="add-domain-btn" type="submit" class="s-btn">Add Domain</button>
        </form>
        <p id="add-domain-error" class="hidden mt-3 text-xs" style="color:#fca5a5;font-family:var(--font-mono)"></p>
      </section>

    </main>

    <script src="/assets/app.js"></script>
    <script src="/assets/auth.js"></script>
    <script src="/assets/dashboard.js"></script>
  </body>
</html>
