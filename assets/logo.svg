<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1a"/>
      <stop offset="100%" style="stop-color:#141e30"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="200" height="200" rx="32" fill="url(#bg)"/>
  <g transform="translate(100,100)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#243b55" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#1a2a45" stroke-width="1"/>
    <g fill="none" stroke="#4fc3f7" stroke-width="1.2" opacity="0.4">
      <path d="M0,-35 L0,-45 M0,35 L0,45 M-35,0 L-45,0 M35,0 L45,0"/>
    </g>
    <g transform="translate(0,-5)">
      <rect x="-20" y="-30" width="40" height="50" rx="6" fill="none" stroke="#4fc3f7" stroke-width="1.5" opacity="0.5"/>
      <path d="M-12,-20 L0,-8 L12,-20" fill="none" stroke="#4fc3f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M-15,-5 L0,8 L15,-5" fill="none" stroke="#4fc3f7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
    </g>
    <g opacity="0.15">
      <text x="0" y="35" text-anchor="middle" font-family="monospace" font-size="6" fill="#4fc3f7">DMARC</text>
      <text x="0" y="42" text-anchor="middle" font-family="monospace" font-size="5" fill="#4fc3f7">SPF DKIM</text>
    </g>
    <g filter="url(#glow)">
      <circle cx="-30" cy="-25" r="2" fill="#4fc3f7">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="30" cy="-25" r="2" fill="#4fc3f7">
        <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-30" cy="20" r="2" fill="#4fc3f7">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="30" cy="20" r="2" fill="#4fc3f7">
        <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
