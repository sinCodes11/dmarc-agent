<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <linearGradient id="bgDa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="50%" style="stop-color:#0a0f1a"/>
      <stop offset="100%" style="stop-color:#141e30"/>
    </linearGradient>
    <linearGradient id="accentDa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc3f7"/>
      <stop offset="100%" style="stop-color:#29b6f6"/>
    </linearGradient>
    <linearGradient id="scanlineDa" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:transparent"/>
      <stop offset="50%" style="stop-color:#4fc3f7;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </linearGradient>
    <filter id="glowDa"><feGaussianBlur stdDeviation="2"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowStrongDa"><feGaussianBlur stdDeviation="4"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clipDa"><rect width="900" height="200" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clipDa)">
    <rect width="900" height="200" rx="16" fill="url(#bgDa)"/>
    <rect width="900" height="200" rx="16" fill="none" stroke="#4fc3f7" stroke-width="1" opacity="0.2"/>
    <g opacity="0.03">
      <line x1="0" y1="50" x2="900" y2="50" stroke="#4fc3f7" stroke-width="1"/>
      <line x1="0" y1="100" x2="900" y2="100" stroke="#4fc3f7" stroke-width="1"/>
      <line x1="0" y1="150" x2="900" y2="150" stroke="#4fc3f7" stroke-width="1"/>
    </g>
    <rect x="0" y="0" width="900" height="200" fill="url(#scanlineDa)" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <g transform="translate(65,100)">
      <g filter="url(#glowDa)">
        <circle cx="0" cy="0" r="45" fill="none" stroke="#243b55" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="35" fill="none" stroke="#1a2a45" stroke-width="1"/>
        <g fill="none" stroke="#4fc3f7" stroke-width="1.2" opacity="0.4">
          <path d="M0,-35 L0,-45 M0,35 L0,45 M-35,0 L-45,0 M35,0 L45,0"/>
        </g>
        <g transform="translate(0,-5)">
          <rect x="-20" y="-30" width="40" height="50" rx="6" fill="none" stroke="#4fc3f7" stroke-width="1.5" opacity="0.5"/>
          <path d="M-12,-20 L0,-8 L12,-20" fill="none" stroke="#4fc3f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
            <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
          </path>
          <path d="M-15,-5 L0,8 L15,-5" fill="none" stroke="#4fc3f7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
        </g>
        <g opacity="0.2">
          <text x="0" y="32" text-anchor="middle" font-family="monospace" font-size="6" fill="#4fc3f7">DMARC</text>
          <text x="0" y="40" text-anchor="middle" font-family="monospace" font-size="5" fill="#4fc3f7">SPF DKIM</text>
        </g>
        <circle cx="-30" cy="-25" r="2" fill="#4fc3f7">
          <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="30" cy="-25" r="2" fill="#4fc3f7">
          <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-30" cy="20" r="2" fill="#4fc3f7">
          <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
        </circle>
        <circle cx="30" cy="20" r="2" fill="#4fc3f7">
          <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
    <g transform="translate(180,60)">
      <text x="0" y="0" font-family="monospace" font-size="42" font-weight="bold" fill="#4fc3f7" filter="url(#glowStrongDa)">
        DMARC Agent
        <animate attributeName="opacity" values="1;0.92;1" dur="2.5s" repeatCount="indefinite"/>
      </text>
      <text x="0" y="0" font-family="monospace" font-size="42" font-weight="bold" fill="#4fc3f7" opacity="0.2">
        <animate attributeName="opacity" values="0.2;0.5;0.2" dur="0.06s" repeatCount="indefinite"/>
        DMARC Agent
      </text>
      <text x="0" y="30" font-family="monospace" font-size="13" fill="#888" letter-spacing="3">EMAIL AUTHENTICATION & MONITORING</text>
      <text x="0" y="50" font-family="monospace" font-size="11" fill="#666" letter-spacing="1">SPF · DKIM · DMARC · DNS ANALYSIS</text>
    </g>
    <g transform="translate(780, 170)" opacity="0.35">
      <text font-family="monospace" font-size="9" fill="#4fc3f7">DNS</text>
    </g>
  </g>
</svg>